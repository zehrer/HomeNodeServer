[workspace]
members = [
    "crates/homenode-definitions",
    "crates/homenode-sdk",
    "crates/homenode-server",
    "modules/web",
    "modules/matter-controller",
    "modules/matter-bridge",
    "modules/network-discovery",
    "modules/bthome",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
dns-lookup = "2.0"
hyper-util = "0.1"
if-addrs = "0.13"
ipnet = "2.10"
prost = "0.13"
protoc-bin-vendored = "3"
rhai = { version = "1.20", features = ["sync"] }
rs-matter = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surge-ping = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
