[server]
socket_path = "../.tmp/homenode-server.sock"
log_filter = "info"

[modules.web]
enabled = true
module_id = "web"
program = "homenode-module-web"
config = "modules/web.example.toml"

[modules.matter_controller]
enabled = true
module_id = "matter-controller"
program = "homenode-module-matter-controller"
config = "modules/matter-controller.example.toml"

[modules.matter_bridge]
enabled = true
module_id = "matter-bridge"
program = "homenode-module-matter-bridge"
config = "modules/matter-bridge.example.toml"

[modules.network_discovery]
enabled = true
module_id = "network-discovery"
program = "homenode-module-network-discovery"
config = "modules/network-discovery.example.toml"

[modules.bthome]
enabled = true
module_id = "bthome"
program = "homenode-module-bthome"
config = "modules/bthome.example.toml"

[modules.philips_hue]
enabled = true
module_id = "philips-hue"
program = "homenode-module-philips-hue"
config = "modules/philips-hue.example.toml"

[modules.tuya]
enabled = false
module_id = "tuya"
config = "modules/tuya.example.toml"

[modules.shelly]
enabled = false
module_id = "shelly"
config = "modules/shelly.example.toml"

[modules.govee]
enabled = false
module_id = "govee"
config = "modules/govee.example.toml"

[modules.zigbee]
enabled = false
module_id = "zigbee"
config = "modules/zigbee.example.toml"

[modules.switchbot]
enabled = false
module_id = "switchbot"
config = "modules/switchbot.example.toml"

[modules.native_devices]
enabled = false
module_id = "native-devices"
config = "modules/native-devices.example.toml"

[modules.ai_local]
enabled = false
module_id = "ai-local"
config = "modules/ai-local.example.toml"

[modules.extensions]
enabled = false
module_id = "extensions"
config = "modules/extensions.example.toml"
